<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADC-100 Serials</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0A0E1A;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #131929;
            border-bottom: 1px solid #00C2FF;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar .logo { color: #00C2FF; font-size: 12px; letter-spacing: 2px; }
        .navbar h1 { font-size: 18px; color: #fff; }
        .navbar-right { display: flex; align-items: center; gap: 16px; }
        .nav-link {
            color: #8A9BB5;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
        }
        .nav-link:hover { border-color: #00C2FF; color: #00C2FF; }
        .logout-btn {
            background: none;
            border: 1px solid #FF4C4C;
            color: #FF4C4C;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .logout-btn:hover { background: #FF4C4C; color: #fff; }

        .container { padding: 32px; max-width: 1200px; margin: 0 auto; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .topbar h2 { font-size: 20px; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #131929;
            border: 1px solid #1e2d4a;
            border-radius: 10px;
            padding: 16px 20px;
        }
        .stat-card .label { font-size: 12px; color: #8A9BB5; margin-bottom: 6px; }
        .stat-card .value { font-size: 28px; font-weight: bold; }
        .stat-card .value.blue  { color: #00C2FF; }
        .stat-card .value.green { color: #00E5A0; }
        .stat-card .value.orange { color: #FFB347; }

        .card {
            background: #131929;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 20px;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-row select, .filter-row input {
            padding: 8px 12px;
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }
        .filter-row select:focus, .filter-row input:focus {
            outline: none;
            border-color: #00C2FF;
        }

        .serials-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .serials-table th {
            text-align: left;
            padding: 10px 12px;
            color: #8A9BB5;
            border-bottom: 1px solid #1e2d4a;
            font-weight: normal;
            font-size: 12px;
            text-transform: uppercase;
        }
        .serials-table td { padding: 12px; border-bottom: 1px solid #0d1525; }
        .serials-table tr:hover td { background: #0d1525; }

        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-assigned   { background: #00E5A020; color: #00E5A0; border: 1px solid #00E5A0; }
        .badge-unassigned { background: #FFB34720; color: #FFB347; border: 1px solid #FFB347; }

        .serial-mono { font-family: monospace; font-size: 13px; color: #00C2FF; }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-secondary { background: #1e2d4a; color: #fff; }
        .btn-secondary:hover { background: #2a3d5e; }

        .empty { text-align: center; padding: 40px; color: #8A9BB5; }

        /* QR Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #00000080;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #131929;
            border: 1px solid #00C2FF;
            border-radius: 12px;
            padding: 32px;
            width: 320px;
            text-align: center;
        }
        .modal h3 { color: #00C2FF; margin-bottom: 20px; }
        .qr-box {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .qr-serial { font-family: monospace; font-size: 13px; color: #fff; margin-bottom: 4px; }
        .qr-brand  { font-size: 10px; color: #8A9BB5; letter-spacing: 2px; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-primary { background: #00C2FF; color: #0A0E1A; }
        .btn-primary:hover { background: #0066FF; color: #fff; }
        .btn-cancel  { background: #1e2d4a; color: #fff; }
        .btn-cancel:hover { background: #2a3d5e; }

        /* Print */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
            }
        }
        #printArea { display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="navbar">
        <div>
            <div class="logo">INNOVOLTX</div>
            <h1>Serial Registry</h1>
        </div>
        <div class="navbar-right">
            <a class="nav-link" href="/">← Devices</a>
            <button class="logout-btn" onclick="window.location='/api/logout'">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-row">
            <div class="stat-card">
                <div class="label">Total Serials</div>
                <div class="value blue" id="statTotal">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Assigned</div>
                <div class="value green" id="statAssigned">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Unassigned</div>
                <div class="value orange" id="statUnassigned">—</div>
            </div>
        </div>

        <div class="card">
            <div class="filter-row">
                <select id="filterStatus" onchange="renderSerials()">
                    <option value="all">All Serials</option>
                    <option value="assigned">Assigned</option>
                    <option value="unassigned">Unassigned</option>
                </select>
                <input type="text" id="filterSearch" placeholder="Search serial..." oninput="renderSerials()">
            </div>

            <table class="serials-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Serial Number</th>
                        <th>Status</th>
                        <th>Device</th>
                        <th>Generated</th>
                        <th>Assigned</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="serialsBody">
                    <tr><td colspan="7" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- QR Modal -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal">
            <h3>Serial QR Code</h3>
            <div class="qr-box">
                <div id="modalQR"></div>
            </div>
            <div class="qr-serial" id="modalSerial">—</div>
            <div class="qr-brand">INNOVOLTX — ADC-100</div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="printQR()">🖨️ Print</button>
                <button class="btn btn-cancel" onclick="closeQRModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Print Area -->
    <div id="printArea">
        <div id="printQR"></div>
        <div style="font-family:monospace; font-size:14px; font-weight:bold; margin-top:8px;" id="printSerial"></div>
        <div style="font-size:10px; color:#666; letter-spacing:2px; margin-top:4px;">INNOVOLTX — ADC-100</div>
    </div>

    <script>
        let serials   = [];
        let devices   = [];
        let activeQR  = null;
        let activeSerial = null;

        async function loadData() {
            const [sRes, dRes] = await Promise.all([
                fetch('/api/devices/serials'),
                fetch('/api/devices')
            ]);
            serials = await sRes.json();
            devices = await dRes.json();
            updateStats();
            renderSerials();
        }

        function updateStats() {
            const assigned   = serials.filter(s => s.device_id).length;
            const unassigned = serials.length - assigned;
            document.getElementById('statTotal').textContent      = serials.length;
            document.getElementById('statAssigned').textContent   = assigned;
            document.getElementById('statUnassigned').textContent = unassigned;
        }

        function renderSerials() {
            const filter = document.getElementById('filterStatus').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            const body   = document.getElementById('serialsBody');

            let filtered = serials.filter(s => {
                if (filter === 'assigned'   && !s.device_id) return false;
                if (filter === 'unassigned' &&  s.device_id) return false;
                if (search && !s.serial.toLowerCase().includes(search)) return false;
                return true;
            });

            if (filtered.length === 0) {
                body.innerHTML = '<tr><td colspan="7" class="empty">No serials found</td></tr>';
                return;
            }

            body.innerHTML = filtered.map((s, i) => {
                const device     = s.device_id ? devices.find(d => d.id === s.device_id) : null;
                const deviceName = device ? `${device.name || 'Unnamed'} (${device.mqtt_id || '—'})` : '—';
                const status     = s.device_id
                    ? '<span class="badge badge-assigned">ASSIGNED</span>'
                    : '<span class="badge badge-unassigned">UNASSIGNED</span>';
                const generated  = new Date(s.created_at).toLocaleDateString();
                const assigned   = s.assigned_at ? new Date(s.assigned_at).toLocaleDateString() : '—';

                return `<tr>
                    <td style="color:#8A9BB5">${i + 1}</td>
                    <td class="serial-mono">${s.serial}</td>
                    <td>${status}</td>
                    <td style="color:#8A9BB5">${deviceName}</td>
                    <td style="color:#8A9BB5">${generated}</td>
                    <td style="color:#8A9BB5">${assigned}</td>
                    <td><button class="btn btn-secondary" onclick="showQR('${s.serial}')">🔲 QR</button></td>
                </tr>`;
            }).join('');
        }

        function showQR(serial) {
            activeSerial = serial;
            document.getElementById('modalSerial').textContent = serial;

            const qrDiv = document.getElementById('modalQR');
            qrDiv.innerHTML = '';
            activeQR = new QRCode(qrDiv, {
                text:         serial,
                width:        180,
                height:       180,
                colorDark:    '#000000',
                colorLight:   '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
            document.getElementById('modalQR').innerHTML = '';
            activeQR = null;
        }

        function printQR() {
            const printQR = document.getElementById('printQR');
            printQR.innerHTML = '';
            new QRCode(printQR, {
                text:         activeSerial,
                width:        200,
                height:       200,
                colorDark:    '#000000',
                colorLight:   '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
            document.getElementById('printSerial').textContent = activeSerial;
            document.getElementById('printArea').style.display = 'block';
            window.print();
            document.getElementById('printArea').style.display = 'none';
        }

        loadData();
        setInterval(loadData, 30000);
    </script>

</body>
</html>
