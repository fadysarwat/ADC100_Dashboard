<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADC-100 App Users</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0A0E1A;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #131929;
            border-bottom: 1px solid #00C2FF;
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .navbar .logo { color: #00C2FF; font-size: 12px; letter-spacing: 2px; }
        .navbar h1 { font-size: 18px; color: #fff; }
        .navbar-right { display: flex; align-items: center; gap: 12px; }
        .nav-link {
            color: #8A9BB5;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
        }
        .nav-link:hover { border-color: #00C2FF; color: #00C2FF; }
        .logout-btn {
            background: none;
            border: 1px solid #FF4C4C;
            color: #FF4C4C;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .logout-btn:hover { background: #FF4C4C; color: #fff; }

        .container { padding: 32px; max-width: 1100px; margin: 0 auto; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .topbar h2 { font-size: 20px; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary   { background: #00C2FF; color: #0A0E1A; }
        .btn-primary:hover { background: #0066FF; color: #fff; }
        .btn-danger    { background: #FF4C4C; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        .btn-secondary { background: #1e2d4a; color: #fff; }
        .btn-secondary:hover { background: #2a3d5e; }
        .btn-warning   { background: #FFB347; color: #0A0E1A; }
        .btn-warning:hover { background: #e09030; }
        .btn-success   { background: #00E5A0; color: #0A0E1A; }
        .btn-success:hover { background: #00b87a; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .card {
            background: #131929;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h3 {
            color: #00C2FF;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-header h3 { margin-bottom: 0; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }
        @media (max-width: 700px) { .form-row { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; color: #8A9BB5; }
        .form-group input {
            padding: 9px 12px;
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }
        .form-group input:focus { outline: none; border-color: #00C2FF; }

        .users-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .users-table th {
            text-align: left;
            padding: 8px 12px;
            color: #8A9BB5;
            border-bottom: 1px solid #1e2d4a;
            font-weight: normal;
            font-size: 12px;
            text-transform: uppercase;
        }
        .users-table td { padding: 12px; border-bottom: 1px solid #0d1525; vertical-align: middle; }
        .users-table tr:hover td { background: #0d1525; }

        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-active   { background: #00E5A020; color: #00E5A0; border: 1px solid #00E5A0; }
        .badge-inactive { background: #FF4C4C20; color: #FF4C4C; border: 1px solid #FF4C4C; }

        .empty { text-align: center; padding: 40px; color: #8A9BB5; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #00000080;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #131929;
            border: 1px solid #00C2FF;
            border-radius: 12px;
            padding: 28px;
            width: 520px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h3 { color: #00C2FF; margin-bottom: 20px; font-size: 16px; }

        .door-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .door-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
        }
        .door-item .door-info { font-size: 13px; }
        .door-item .door-id   { font-family: monospace; font-size: 12px; color: #00C2FF; margin-top: 2px; }

        .add-door-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .add-door-row select {
            flex: 1;
            padding: 8px 12px;
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }
        .add-door-row select:focus { outline: none; border-color: #00C2FF; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

        .err-msg { font-size: 12px; color: #FF4C4C; margin-top: 8px; display: none; }
        .err-msg.show { display: block; }
    </style>
    <script src="/js/rbac.js"></script>
</head>
<body>

    <div class="navbar">
        <div>
            <div class="logo">INNOVOLTX</div>
            <h1>App Users</h1>
        </div>
        <div class="navbar-right">
            <a class="nav-link" href="/">← Devices</a>
            <button class="logout-btn" onclick="window.location='/api/logout'">Logout</button>
        </div>
    </div>

    <div class="container">

        <!-- Add User -->
        <div class="card">
            <h3>Add New App User</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="newUsername" placeholder="john_doe">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="newFullName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters">
                </div>
                <button class="btn btn-primary" onclick="addUser()">+ Add</button>
            </div>
            <div class="err-msg" id="addError"></div>
        </div>

        <!-- Users List -->
        <div class="card">
            <div class="card-header">
                <h3>Users</h3>
                <button class="btn btn-secondary btn-sm" onclick="loadUsers()">🔄 Refresh</button>
            </div>
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Doors</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="6" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Doors Modal -->
    <div class="modal-overlay" id="doorsModal">
        <div class="modal">
            <h3 id="modalTitle">Door Access</h3>

            <div class="door-list" id="doorList">
                <div class="empty">No doors assigned</div>
            </div>

            <div style="font-size:12px; color:#8A9BB5; margin-bottom:8px;">Add door access:</div>
            <div class="add-door-row">
                <select id="doorSelect">
                    <option value="">Select door...</option>
                </select>
                <button class="btn btn-primary btn-sm" style="width:auto;" onclick="grantDoor()">+ Grant</button>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDoorsModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let allDevices   = [];
        let usersById    = {};
        let currentUser  = null;
        let currentDoors = [];

        async function loadDevices() {
            const res = await fetch('/api/devices');
            allDevices = await res.json();
            allDevices = allDevices.filter(d => d.activated);
        }

        async function loadUsers() {
            const res   = await fetch('/api/appusers');
            const users = await res.json();
            usersById = {}; users.forEach(u => { usersById[u.id] = u; });
            const body  = document.getElementById('usersBody');

            if (users.length === 0) {
                body.innerHTML = '<tr><td colspan="6" class="empty">No app users yet</td></tr>';
                return;
            }

            body.innerHTML = users.map(u => `
                <tr>
                    <td style="font-weight:bold;">${esc(u.username)}</td>
                    <td style="color:#8A9BB5;">${esc(u.full_name || '—')}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="openDoorsModal(${Number(u.id)})">
                            🚪 ${u.door_count} door${u.door_count != 1 ? 's' : ''}
                        </button>
                    </td>
                    <td>
                        <span class="badge ${u.is_active ? 'badge-active' : 'badge-inactive'}">
                            ${u.is_active ? 'ACTIVE' : 'INACTIVE'}
                        </span>
                    </td>
                    <td style="color:#8A9BB5;">${new Date(u.created_at).toLocaleDateString()}</td>
                    <td style="display:flex; gap:6px; flex-wrap:wrap;">
                        <button class="btn btn-sm ${u.is_active ? 'btn-warning' : 'btn-success'}"
                                onclick="toggleUser(${u.id})">
                            ${u.is_active ? '⏸ Disable' : '▶ Enable'}
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${Number(u.id)})">Delete</button>
                    </td>
                </tr>`).join('');
        }

        async function addUser() {
            const username  = document.getElementById('newUsername').value.trim();
            const fullName  = document.getElementById('newFullName').value.trim();
            const password  = document.getElementById('newPassword').value;
            const errEl     = document.getElementById('addError');

            errEl.classList.remove('show');

            if (!username || !password) { errEl.textContent = 'Username and password required'; errEl.classList.add('show'); return; }
            if (password.length < 6)    { errEl.textContent = 'Password must be at least 6 characters'; errEl.classList.add('show'); return; }

            const res  = await fetch('/api/appusers', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, password, full_name: fullName })
            });
            const data = await res.json();

            if (!res.ok) { errEl.textContent = data.error; errEl.classList.add('show'); return; }

            document.getElementById('newUsername').value  = '';
            document.getElementById('newFullName').value  = '';
            document.getElementById('newPassword').value  = '';
            loadUsers();
        }

        async function toggleUser(id) {
            const res = await fetch(`/api/appusers/${id}/toggle`, { method: 'PATCH' });
            if (res.ok) loadUsers();
        }

        async function deleteUser(id) {
            const username = (usersById[id] || {}).username || '';
            if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
            const res = await fetch(`/api/appusers/${id}`, { method: 'DELETE' });
            if (res.ok) loadUsers();
        }

        /* ── Doors Modal ── */
        async function openDoorsModal(userId) {
            const username = (usersById[userId] || {}).username || '';
            currentUser = userId;
            document.getElementById('modalTitle').textContent = `Door Access — ${username}`;

            /* Load user's current doors */
            const res    = await fetch(`/api/appusers/${userId}/doors`);
            currentDoors = await res.json();
            renderDoorList();

            /* Populate door select */
            const sel = document.getElementById('doorSelect');
            sel.innerHTML = '<option value="">Select door...</option>' +
                allDevices.map(d => `<option value="${Number(d.id)}">${esc(d.name || 'Unnamed')} — ${esc(d.mqtt_id)}</option>`).join('');

            document.getElementById('doorsModal').classList.add('active');
        }

        function renderDoorList() {
            const list = document.getElementById('doorList');
            if (currentDoors.length === 0) {
                list.innerHTML = '<div class="empty">No doors assigned yet</div>';
                return;
            }
            list.innerHTML = currentDoors.map(d => `
                <div class="door-item">
                    <div class="door-info">
                        <div>${esc(d.name || 'Unnamed')}</div>
                        <div class="door-id">${esc(d.mqtt_id)} — ${esc(d.location || '—')}</div>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="revokeDoor(${Number(d.id)})">Revoke</button>
                </div>`).join('');
        }

        async function grantDoor() {
            const deviceId = document.getElementById('doorSelect').value;
            if (!deviceId) return;

            const res = await fetch(`/api/appusers/${currentUser}/doors`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ device_id: deviceId })
            });
            if (res.ok) {
                const res2   = await fetch(`/api/appusers/${currentUser}/doors`);
                currentDoors = await res2.json();
                renderDoorList();
                loadUsers();
            }
        }

        async function revokeDoor(deviceId) {
            const res = await fetch(`/api/appusers/${currentUser}/doors/${deviceId}`, { method: 'DELETE' });
            if (res.ok) {
                currentDoors = currentDoors.filter(d => d.id !== deviceId);
                renderDoorList();
                loadUsers();
            }
        }

        function closeDoorsModal() {
            document.getElementById('doorsModal').classList.remove('active');
            currentUser  = null;
            currentDoors = [];
        }

        /* ── Init ── */
        async function init() {
            await RBAC.ready;
            await loadDevices();
            await loadUsers();
        }

        init();
    </script>

</body>
</html>
