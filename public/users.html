<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Users — ADC-100</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0A0E1A;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #131929;
            border-bottom: 1px solid #00C2FF;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .navbar .logo { color: #00C2FF; font-size: 12px; letter-spacing: 2px; }
        .navbar h1   { font-size: 18px; color: #fff; }
        .back-btn {
            background: none;
            border: 1px solid #1e2d4a;
            color: #8A9BB5;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .back-btn:hover { border-color: #00C2FF; color: #00C2FF; }

        .container { padding: 32px; max-width: 1100px; margin: 0 auto; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .page-header h2 { font-size: 20px; }
        .page-header p  { font-size: 13px; color: #8A9BB5; margin-top: 4px; }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-primary   { background: #00C2FF; color: #0A0E1A; }
        .btn-primary:hover { background: #0099cc; }
        .btn-danger    { background: #FF4C4C; color: #fff; }
        .btn-danger:hover  { background: #cc0000; }
        .btn-secondary { background: #1e2d4a; color: #fff; }
        .btn-secondary:hover { background: #2a3d5e; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; }

        /* Add User Form */
        .add-user-card {
            background: #131929;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .add-user-card .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
        .add-user-card label { font-size: 12px; color: #8A9BB5; }
        .add-user-card input {
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
            color: #fff;
            padding: 9px 12px;
            font-size: 13px;
            outline: none;
        }
        .add-user-card input:focus { border-color: #00C2FF; }

        /* Users list */
        .users-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .user-card {
            background: #131929;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .user-card.inactive { opacity: 0.6; }
        .user-card:hover { border-color: #2a3d5e; }

        .user-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
        }
        .user-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #00C2FF20;
            border: 2px solid #00C2FF50;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .user-avatar.inactive-avatar {
            background: #FF4C4C20;
            border-color: #FF4C4C50;
        }
        .user-info { flex: 1; }
        .user-name { font-size: 15px; font-weight: bold; }
        .user-meta { font-size: 12px; color: #8A9BB5; margin-top: 2px; }

        .user-actions { display: flex; gap: 8px; align-items: center; }

        .toggle-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .toggle-pill.active   { background: #00E5A020; color: #00E5A0; border: 1px solid #00E5A040; }
        .toggle-pill.inactive { background: #FF4C4C20; color: #FF4C4C; border: 1px solid #FF4C4C40; }
        .toggle-pill:hover { filter: brightness(1.2); }

        .chevron {
            font-size: 12px;
            color: #8A9BB5;
            transition: transform 0.2s;
        }
        .chevron.open { transform: rotate(180deg); }

        /* Credentials panel */
        .cred-panel {
            border-top: 1px solid #1e2d4a;
            padding: 16px 20px;
            display: none;
            background: #0d1525;
        }
        .cred-panel.open { display: block; }

        .cred-section-title {
            font-size: 12px;
            color: #8A9BB5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .cred-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .cred-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #131929;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .cred-type-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .cred-type-rfid { background: #00C2FF20; color: #00C2FF; border: 1px solid #00C2FF40; }
        .cred-type-pin  { background: #FFB34720; color: #FFB347; border: 1px solid #FFB34740; }
        .cred-type-qr   { background: #00E5A020; color: #00E5A0; border: 1px solid #00E5A040; }

        .cred-info { flex: 1; }
        .cred-identifier { font-family: monospace; font-size: 13px; color: #fff; }
        .cred-device     { font-size: 11px; color: #8A9BB5; margin-top: 2px; }

        .cred-qr-thumb {
            width: 36px; height: 36px;
            background: #fff;
            border-radius: 4px;
            padding: 3px;
            cursor: pointer;
        }

        .empty-creds {
            font-size: 13px;
            color: #8A9BB5;
            padding: 12px 0;
            font-style: italic;
        }

        /* Add credential form */
        .add-cred-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e2d4a;
        }
        .add-cred-form .field { display: flex; flex-direction: column; gap: 4px; }
        .add-cred-form label  { font-size: 11px; color: #8A9BB5; }
        .add-cred-form input,
        .add-cred-form select {
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
            color: #fff;
            padding: 7px 10px;
            font-size: 13px;
            outline: none;
        }
        .add-cred-form input:focus,
        .add-cred-form select:focus { border-color: #00C2FF; }

        /* QR Modal */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: #00000090;
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #131929;
            border: 1px solid #00C2FF;
            border-radius: 12px;
            padding: 28px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .modal-box h3  { font-size: 16px; margin-bottom: 4px; }
        .modal-box p   { font-size: 12px; color: #8A9BB5; margin-bottom: 20px; }
        .modal-qr-wrap {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            display: inline-block;
            margin-bottom: 16px;
        }
        .modal-qr-label {
            font-family: monospace;
            font-size: 12px;
            color: #0A0E1A;
            margin-top: 8px;
            font-weight: bold;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

        .feedback {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }
        .feedback.success { background: #00E5A020; color: #00E5A0; border: 1px solid #00E5A0; display: block; }
        .feedback.error   { background: #FF4C4C20; color: #FF4C4C; border: 1px solid #FF4C4C; display: block; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8A9BB5;
            font-size: 14px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
    <script src="/js/rbac.js"></script>
</head>
<body>

<div class="navbar">
    <button class="back-btn" onclick="window.location='/'">← Back</button>
    <div style="flex:1">
        <div class="logo">INNOVOLTX</div>
        <h1>Door Users</h1>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <div>
            <h2>User Management</h2>
            <p>Manage who can access your doors — assign RFID cards, PINs, and QR codes per device.</p>
        </div>
    </div>

    <!-- Add User -->
    <div class="add-user-card">
        <div class="field">
            <label>Full Name</label>
            <input type="text" id="newUserName" placeholder="e.g. Ahmed Hassan" onkeydown="if(event.key==='Enter') addUser()">
        </div>
        <div class="field" data-perm="orgs.manage">
            <label>Customer</label>
            <select id="newUserOrg" style="padding:9px 12px; background:#0A0E1A; border:1px solid #1e2d4a; border-radius:6px; color:#fff; font-size:14px;">
                <option value="">— Unassigned —</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="addUser()">+ Add User</button>
        <div id="addUserFeedback" class="feedback" style="flex-basis:100%; margin-top:0;"></div>
    </div>

    <!-- Users List -->
    <div id="usersContainer">
        <div class="empty-state">
            <div class="icon">⏳</div>
            <div>Loading users...</div>
        </div>
    </div>
</div>

<!-- QR Modal -->
<div class="modal-overlay" id="qrModal">
    <div class="modal-box">
        <h3 id="qrModalTitle">User QR Code</h3>
        <p id="qrModalSub">Scan with the mobile app to access this door</p>
        <div class="modal-qr-wrap">
            <div id="qrModalCode"></div>
            <div class="modal-qr-label" id="qrModalLabel"></div>
        </div>
        <div style="font-size:11px; color:#8A9BB5; margin-bottom:4px;" id="qrModalContent"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary btn-sm" onclick="printQrModal()">🖨️ Print</button>
            <button class="btn btn-secondary btn-sm" onclick="closeQrModal()">✕ Close</button>
        </div>
    </div>
</div>

<script>
    let allDevices = [];
    let users      = [];
    const orgNames = {};

    /* ── Load devices (for dropdown) ── */
    async function loadDevices() {
        const res  = await fetch('/api/devices');
        allDevices = await res.json();
    }

    /* ── Load users ── */
    async function loadUsers() {
        const res = await fetch('/api/users');
        users     = await res.json();
        renderUsers();
    }

    /* ── Render all users ── */
    function renderUsers() {
        const container = document.getElementById('usersContainer');

        if (users.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">👤</div>
                    <div>No users yet — add your first user above</div>
                </div>`;
            return;
        }

        container.innerHTML = users.map(u => renderUserCard(u)).join('');
    }

    function renderUserCard(u) {
        const avatarClass = u.active ? '' : 'inactive-avatar';
        const cardClass   = u.active ? '' : 'inactive';
        const pillClass   = u.active ? 'active' : 'inactive';
        const pillLabel   = u.active ? '✅ Active' : '⛔ Inactive';
        const joined      = new Date(u.created_at).toLocaleDateString();

        return `
        <div class="user-card ${cardClass}" id="user-card-${u.id}">
            <div class="user-card-header" onclick="toggleUser(${u.id})">
                <div class="user-avatar ${avatarClass}">👤</div>
                <div class="user-info">
                    <div class="user-name">${escHtml(u.name)}</div>
                    <div class="user-meta">Added ${joined}${RBAC.can('orgs.manage') ? ' · ' + (u.org_id ? escHtml(orgNames[u.org_id] || ('Customer #' + u.org_id)) : '<span style="color:#FFB347">Unassigned</span>') : ''}</div>
                </div>
                <div class="user-actions" onclick="event.stopPropagation()">
                    <button class="toggle-pill ${pillClass}" onclick="toggleActive(${u.id}, ${!u.active})">${pillLabel}</button>
                    <button class="btn btn-danger btn-xs" onclick="deleteUser(${Number(u.id)})">🗑</button>
                </div>
                <div class="chevron" id="chevron-${u.id}">▼</div>
            </div>
            <div class="cred-panel" id="cred-panel-${u.id}">
                <div class="cred-section-title">Credentials</div>
                <div id="cred-list-${u.id}" class="cred-list">
                    <div class="empty-creds">Loading...</div>
                </div>
                <div class="add-cred-form">
                    <div class="field">
                        <label>Device</label>
                        <select id="cred-device-${u.id}">
                            ${allDevices.filter(d => (d.org_id ?? null) === (u.org_id ?? null)).map(d => `<option value="${Number(d.id)}">${escHtml(d.name || d.serial)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label>Type</label>
                        <select id="cred-type-${u.id}" onchange="updateCredPlaceholder(${u.id})">
                            <option value="rfid">RFID</option>
                            <option value="pin">PIN</option>
                            <option value="qr">QR</option>
                        </select>
                    </div>
                    <div class="field" id="cred-id-field-${u.id}">
                        <label>Identifier</label>
                        <input type="text" id="cred-id-${u.id}" placeholder="Card UID or PIN slot (1–10)" style="width:170px;">
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="addCredential(${u.id})">+ Add</button>
                </div>
                <div id="cred-feedback-${u.id}" class="feedback"></div>
            </div>
        </div>`;
    }

    /* ── Toggle expand/collapse ── */
    const openPanels = new Set();

    function toggleUser(userId) {
        const panel   = document.getElementById(`cred-panel-${userId}`);
        const chevron = document.getElementById(`chevron-${userId}`);
        if (openPanels.has(userId)) {
            openPanels.delete(userId);
            panel.classList.remove('open');
            chevron.classList.remove('open');
        } else {
            openPanels.add(userId);
            panel.classList.add('open');
            chevron.classList.add('open');
            loadCredentials(userId);
        }
    }

    /* ── Load credentials for a user ── */
    async function loadCredentials(userId) {
        const listEl = document.getElementById(`cred-list-${userId}`);
        listEl.innerHTML = '<div class="empty-creds">Loading...</div>';

        const res   = await fetch(`/api/users/${userId}/credentials`);
        const creds = await res.json();

        if (creds.length === 0) {
            listEl.innerHTML = '<div class="empty-creds">No credentials yet — add one below</div>';
            return;
        }

        creds.forEach(c => { credCache[c.id] = c; });
        listEl.innerHTML = creds.map(c => renderCredItem(c, userId)).join('');
    }

    function renderCredItem(c, userId) {
        const typeClass = `cred-type-${c.type}`;
        const deviceName = escHtml(c.device_name || c.device_serial || '—');

        let qrThumb = '';
        if (c.type === 'qr') {
            qrThumb = `<div class="cred-qr-thumb" onclick="showQrModal(${Number(c.id)})">
                           <canvas id="qr-thumb-${c.id}" width="30" height="30"></canvas>
                       </div>`;
        }

        return `
        <div class="cred-item" id="cred-item-${c.id}">
            <span class="cred-type-badge ${typeClass}">${escHtml(String(c.type).toUpperCase())}</span>
            <div class="cred-info">
                <div class="cred-identifier">${escHtml(c.identifier)}</div>
                <div class="cred-device">📍 ${deviceName}</div>
            </div>
            ${qrThumb}
            <button class="btn btn-danger btn-xs" onclick="deleteCredential(${c.id}, ${userId})">✕</button>
        </div>`;
    }

    /* Render tiny QR thumbs after DOM update */
    function renderQrThumbs(creds) {
        creds.filter(c => c.type === 'qr').forEach(c => {
            const canvas = document.getElementById(`qr-thumb-${c.id}`);
            if (!canvas) return;
            new QRCode(canvas.parentElement, {
                text:         c.identifier,
                width:        30,
                height:       30,
                colorDark:    '#000000',
                colorLight:   '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        });
    }

    /* ── Update identifier placeholder based on type ── */
    function updateCredPlaceholder(userId) {
        const type  = document.getElementById(`cred-type-${userId}`).value;
        const input = document.getElementById(`cred-id-${userId}`);
        const field = document.getElementById(`cred-id-field-${userId}`);

        if (type === 'rfid') {
            input.placeholder = 'Card UID (e.g. A1B2C3D4)';
            field.style.display = 'flex';
        } else if (type === 'pin') {
            input.placeholder = 'PIN slot number (1–10)';
            field.style.display = 'flex';
        } else if (type === 'qr') {
            input.placeholder = 'QR content (e.g. user:ahmed_123)';
            field.style.display = 'flex';
        }
    }

    /* ── Add user ── */
    async function addUser() {
        const name = document.getElementById('newUserName').value.trim();
        if (!name) { showAddUserFeedback('Enter a name', 'error'); return; }

        const res = await fetch('/api/users', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ name, org_id: (document.getElementById('newUserOrg') || {}).value || null })
        });

        if (res.ok) {
            document.getElementById('newUserName').value = '';
            showAddUserFeedback('User added!', 'success');
            await loadUsers();
        } else {
            const err = await res.json();
            showAddUserFeedback(err.error || 'Error adding user', 'error');
        }
    }

    function showAddUserFeedback(msg, type) {
        const el = document.getElementById('addUserFeedback');
        el.textContent = msg;
        el.className   = 'feedback ' + type;
        setTimeout(() => { el.className = 'feedback'; }, 3000);
    }

    /* ── Toggle active ── */
    async function toggleActive(userId, newActive) {
        const res = await fetch(`/api/users/${userId}/active`, {
            method:  'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ active: newActive })
        });
        if (res.ok) {
            const idx = users.findIndex(u => u.id === userId);
            if (idx >= 0) users[idx].active = newActive;
            renderUsers();
            // Re-open panel if it was open
            if (openPanels.has(userId)) {
                setTimeout(() => {
                    const panel   = document.getElementById(`cred-panel-${userId}`);
                    const chevron = document.getElementById(`chevron-${userId}`);
                    if (panel)   panel.classList.add('open');
                    if (chevron) chevron.classList.add('open');
                }, 0);
            }
        }
    }

    /* ── Delete user ── */
    async function deleteUser(userId) {
        const name = (users.find(u => u.id === userId) || {}).name || '';
        if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
        const res = await fetch(`/api/users/${userId}`, { method: 'DELETE' });
        if (res.ok) {
            users = users.filter(u => u.id !== userId);
            openPanels.delete(userId);
            renderUsers();
        } else {
            alert('Error deleting user');
        }
    }

    /* ── Add credential ── */
    async function addCredential(userId) {
        const deviceId   = document.getElementById(`cred-device-${userId}`).value;
        const type       = document.getElementById(`cred-type-${userId}`).value;
        const identifier = document.getElementById(`cred-id-${userId}`).value.trim();

        if (!identifier) { showCredFeedback(userId, 'Enter an identifier', 'error'); return; }

        const res = await fetch(`/api/users/${userId}/credentials`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ device_id: deviceId, type, identifier })
        });

        if (res.ok) {
            document.getElementById(`cred-id-${userId}`).value = '';
            showCredFeedback(userId, 'Credential added!', 'success');
            loadCredentials(userId);
        } else {
            const err = await res.json();
            const msg = err.code === '23505' ? 'This credential already exists on this device' : (err.error || 'Error');
            showCredFeedback(userId, msg, 'error');
        }
    }

    /* ── Delete credential ── */
    async function deleteCredential(credId, userId) {
        if (!confirm('Remove this credential?')) return;
        const res = await fetch(`/api/users/credentials/${credId}`, { method: 'DELETE' });
        if (res.ok) loadCredentials(userId);
        else alert('Error removing credential');
    }

    function showCredFeedback(userId, msg, type) {
        const el = document.getElementById(`cred-feedback-${userId}`);
        el.textContent = msg;
        el.className   = 'feedback ' + type;
        setTimeout(() => { el.className = 'feedback'; }, 3000);
    }

    /* ── QR Modal ── */
    let currentQrContent = null;
    const credCache = {};

    function showQrModal(credId) {
        const cred       = credCache[credId] || {};
        const identifier = cred.identifier || '';
        const deviceName = cred.device_name || '';
        currentQrContent = identifier;
        document.getElementById('qrModalTitle').textContent = 'User QR Code';
        document.getElementById('qrModalSub').textContent   = deviceName ? `Door: ${deviceName}` : 'Scan with mobile app';
        document.getElementById('qrModalLabel').textContent  = identifier;
        document.getElementById('qrModalContent').textContent = identifier;

        const codeEl = document.getElementById('qrModalCode');
        codeEl.innerHTML = '';
        new QRCode(codeEl, {
            text:         identifier,
            width:        180,
            height:       180,
            colorDark:    '#000000',
            colorLight:   '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById('qrModal').classList.add('open');
    }

    function closeQrModal() {
        document.getElementById('qrModal').classList.remove('open');
        currentQrContent = null;
    }

    function printQrModal() {
        const canvas = document.querySelector('#qrModalCode canvas');
        if (!canvas) return;
        const dataUrl = canvas.toDataURL();
        const label   = document.getElementById('qrModalLabel').textContent;
        const sub     = document.getElementById('qrModalSub').textContent;
        const w = window.open('', '_blank');
        if (!w) { alert('Allow popups for this site'); return; }
        w.document.write(`<!DOCTYPE html>
<html><head><title>QR — ${escHtml(label)}</title>
<style>
body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
.lbl { font-family: monospace; font-size: 13px; font-weight: bold; margin-top: 10px; }
.sub { font-size: 11px; color: #888; margin-top: 4px; }
.brand { font-size: 10px; color: #aaa; letter-spacing: 2px; margin-top: 6px; }
</style></head>
<body>
<img id="qrimg" src="${dataUrl}" width="200" height="200">
<div class="lbl">${escHtml(label)}</div>
<div class="sub">${escHtml(sub)}</div>
<div class="brand">INNOVOLTX — ADC-100</div>
<script>document.getElementById('qrimg').onload=function(){setTimeout(function(){window.print();window.close();},300);};<\/script>
</body></html>`);
        w.document.close();
    }

    /* ── Utilities ── */
    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    /* ── Init ── */
    async function init() {
        await RBAC.ready;
        if (RBAC.can('orgs.manage')) {
            const r = await fetch('/api/orgs');
            if (r.ok) {
                const orgs = await r.json();
                orgs.forEach(o => { orgNames[o.id] = o.name; });
                document.getElementById('newUserOrg').innerHTML = '<option value="">— Unassigned —</option>' +
                    orgs.filter(o => o.is_active).map(o => `<option value="${Number(o.id)}">${escHtml(o.name)}</option>`).join('');
            }
        }
        await loadDevices();
        await loadUsers();
    }

    document.getElementById('qrModal').addEventListener('click', function(e) {
        if (e.target === this) closeQrModal();
    });

    init();
</script>
</body>
</html>
