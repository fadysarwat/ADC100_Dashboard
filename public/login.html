<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADC-100 Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0A0E1A;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #131929;
            padding: 40px;
            border-radius: 12px;
            width: 360px;
            border: 1px solid #00C2FF;
        }

        .logo {
            text-align: center;
            color: #00C2FF;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 32px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #8A9BB5;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0A0E1A;
            border: 1px solid #1e2d4a;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00C2FF;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #00C2FF;
            color: #0A0E1A;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }

        .btn:hover { background: #0066FF; color: #fff; }

        .error {
            background: #FF4C4C20;
            color: #FF4C4C;
            border: 1px solid #FF4C4C;
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            text-align: center;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">INNOVOLTX</div>
        <h2>ADC-100 Dashboard</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin" autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="login()">Login</button>
        <div class="error" id="errorMsg">Invalid username or password</div>
    </div>

    <script>
        /* Login on Enter key */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                document.getElementById('errorMsg').classList.add('show');
                return;
            }

            const res = await fetch('/api/login', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, password })
            });

            if (res.ok) {
                window.location = '/';
            } else {
                document.getElementById('errorMsg').classList.add('show');
            }
        }
    </script>
</body>
</html>
